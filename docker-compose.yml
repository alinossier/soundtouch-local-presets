services:
  soundtouch-presets:
    build: .
    container_name: soundtouch-presets
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONFIG_PATH=/app/config.yaml
      - SPEAKER_NAME=${SPEAKER_NAME:-}
      - SPEAKER_PREFERRED_IP=${SPEAKER_PREFERRED_IP:-}
      - LISTENER_ONLY=${LISTENER_ONLY:-false}
      - ENFORCE_PRESETS=${ENFORCE_PRESETS:-true}
      - PRESET_DEBOUNCE_SECONDS=${PRESET_DEBOUNCE_SECONDS:-3}
      - HEALTH_CHECK_INTERVAL_SECONDS=${HEALTH_CHECK_INTERVAL_SECONDS:-30}
      - WEBSOCKET_RAW_LOG_LEVEL=${WEBSOCKET_RAW_LOG_LEVEL:-DEBUG}
      - API_ENABLED=${API_ENABLED:-true}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8765}
